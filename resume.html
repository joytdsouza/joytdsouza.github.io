<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume — Joy D'Souza</title>
  <meta name="description" content="Resume of Joy D'Souza, Mechanical Engineering student at Georgia Tech.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="accent-bar"></div>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">Joy <span>D'Souza</span></a>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="resume.html">Resume</a></li>
      </ul>
    </div>
  </header>

  <section class="section" style="border-top:none;">
    <div class="container">
      <div class="section-head" style="margin-bottom:32px;">
        <span class="eyebrow">Résumé</span>
        <h2>Resume</h2>
      </div>

      <div class="resume-toolbar">
        <p style="color:var(--navy-soft); font-size:0.95rem;">
          Sized to fit the page width so it's readable without zooming — use the
          button if the embed doesn't load on your browser.
        </p>
        <!-- To update your resume: replace assets/resume.pdf with your new file (keep the same filename) -->
        <a href="assets/resume.pdf" download class="btn btn-accent">Download PDF</a>
      </div>

      <!-- The #view=FitH fragment tells the browser's built-in PDF viewer to open
           fit-to-width instead of fit-to-page, so text is readable at a glance.
           The wrapper is sized to a letter-page aspect ratio (8.5 x 11) so it never
           looks squeezed on mobile. -->
      <div class="resume-frame-wrap media-frame">
        <object data="assets/resume.pdf#view=FitH" type="application/pdf" class="resume-embed">
          <div class="resume-fallback">
            Your browser can't display the embedded PDF.
            <br><br>
            <a href="assets/resume.pdf" class="btn btn-primary" style="margin-top:14px;">Download Resume</a>
          </div>
        </object>
      </div>

    </div>
  </section>

  <footer>
    <div class="container">
      <p>© 2026 Joy D'Souza</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
